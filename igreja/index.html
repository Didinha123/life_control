<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão IASD</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <button class="icon menu-btn" data-act="menu" title="Menu">☰</button>
  <div class="topbar-title" id="topTitle">Visão Geral</div>
  <div class="topbar-tools">
    <button class="btn ghost" data-act="print" title="Imprimir esta página">🖨 <span>Imprimir</span></button>
    <button class="btn ghost" data-act="theme" title="Tema claro/escuro">🌙 <span>Tema</span></button>
  </div>
</header>

<nav id="sidebar">
  <div class="brand">
    <div class="brand-logo">IASD</div>
    <div>
      <div class="brand-name" id="brandName">Igreja Adventista</div>
      <div class="brand-sub">do Sétimo Dia · Gestão</div>
    </div>
  </div>
  <div class="nav" id="nav"></div>
</nav>
<div class="backdrop" data-act="menu"></div>

<main id="main"></main>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <button class="icon" data-act="close-modal">✕</button>
    </div>
    <form id="modalForm" autocomplete="off"></form>
  </div>
</div>

<div id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
